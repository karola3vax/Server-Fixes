// Server Fixes. One setting per line: <fix>.<option> <value>. A fix only runs with <fix>.enable 1.
// Read when the plugin loads. After a change, type server_fixes_reload in the server console (or rcon).
// Turn a fix off here if another plugin (such as GameFixes) already does the same thing.

// Reloads the map when nobody is on it, so a map left running for days stays smooth.
slow_animation.enable 1
slow_animation.reload_interval 1800    // seconds between checks, 60 or more

// A beam without a parent makes CBeam loop forever and freezes the server.
beam_crash.enable 1

// A TestActivator input to a filter with no activator crashes the server.
input_activator_crash.enable 1

// The game refuses a join as "team full" when a map has few spawn points.
team_limit.enable 1

// Shows the players in the server browser.
server_list_players.enable 1
server_list_players.update_interval 5  // seconds

// The engine's ban and competitive-cooldown kick pass.
steam_ban.enable 1
steam_ban.clear_after_pass 1
steam_ban.whitelist ""                 // SteamID64s never kicked by it, separated by commas

// Takes everyone out of noclip when sv_cheats is turned off.
sv_cheats.enable 1

// Drops malformed or flooding voice messages. Never kicks anyone.
voice_flood.enable 1

// With tv_enable 1, keeps GOTV connected so a demo keeps recording across match restarts.
demo_record.enable 1

// Gives every entity its Hammer id (m_sUniqueHammerID).
hammer_id.enable 1

// A map entity whose class the game cannot construct (weapon_cs_base in old map ports) crashes the server.
abstract_entity.enable 1

// Touching the bottom of water stops the jump out of it.
water_jump.enable 1

// Surf / kz ramps: lessens getting stuck on or flung off a ramp. Adds traces to every player's movement,
// so only turn it on for surf or kz maps.
rampbug.enable 0
rampbug.tryplayermove_override 0   // put our own walk back over the game's; off since Valve's own mitigation

// Bots look up the nearest navigation area many times a second; on a server without bots that work is
// wasted. Breaks bot movement: only for servers that never run bots. measure_only 1 blocks nothing and
// logs once a minute how many lookups ran and how long they took.
block_nav_lookup.enable 0
block_nav_lookup.measure_only 1  // 0 blocks every lookup
